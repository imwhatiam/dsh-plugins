name: DSH canary

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      dsh:
        description: DSH version or dist-tag
        required: false
        default: next

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm i -g "@deepseek-ai/dsh@${{ inputs.dsh || 'next' }}"
      - run: npm run compat:probe -- --dsh "${{ inputs.dsh || 'next' }}"

      - if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ inputs.dsh || 'next' }}'
            const title = `DSH canary failed: ${version}`
            const open = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open' })
            const existing = open.data.find((issue) => issue.title === title)
            const body = `The canary probe failed for DSH ${version}.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body })
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body })
            }
