name: DSH canary

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      dsh:
        description: DSH version or dist-tag
        required: false
        default: next

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm i -g "@deepseek-ai/dsh@${{ inputs.dsh || 'next' }}"
      - run: npm run compat:probe -- --dsh "${{ inputs.dsh || 'next' }}"
